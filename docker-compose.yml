services:

  # ── База даних з PostGIS ─────────────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER:     demining
      POSTGRES_PASSWORD: demining_pass
      POSTGRES_DB:       demining_db
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U demining -d demining_db"]
      interval: 5s
      timeout:  5s
      retries:  5

  # ── FastAPI бекенд ───────────────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:              postgresql+asyncpg://demining:demining_pass@db:5432/demining_db
      SECRET_KEY:                supersecretkey_change_in_production
      ALGORITHM:                 HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── React фронтенд (Vite dev server) ────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      # volume mount для hot-reload — зміни у src/ одразу відображаються
      - ./frontend/src:/app/src
    depends_on:
      - backend
    # змінна потрібна для Vite щоб не кешував неправильний хост
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  pg_data:
